name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request as the code-reviewer agent described in .claude/agents/code-reviewer.md.
            If it changes anything in src/content/, also review it as .claude/agents/content-safety.md.
            Follow CLAUDE.md and docs/decisions/. Post findings as inline comments, ranked by severity, and a short summary comment.
          claude_args: "--model claude-opus-5-5"
