name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request as the code-reviewer agent described in .claude/agents/code-reviewer.md.
            If it changes anything in content/ or src/content/, also review every changed card as .claude/agents/content-safety.md, re-checking its claims against its sources.
            Follow CLAUDE.md and docs/decisions/. Post findings as inline comments, ranked by severity, and a short summary comment.
          # Without allowed tools the review runs but can't post anything.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
